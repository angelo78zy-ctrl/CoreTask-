name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip -q CoreTask-android.zip
      - name: Compilar
        run: |
          cd CoreTask
          if ! gradle assembleDebug --no-daemon --console=plain > ../build.log 2>&1; then
            grep -E "^e: " ../build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 25 ../build.log | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CoreTask-apk
          path: CoreTask/app/build/outputs/apk/debug/*.apk
